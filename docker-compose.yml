version: '3.8'

services:
  app:
    build: .
    container_name: karting-analysis
    restart: unless-stopped
    volumes:
      - /mnt/data/kibergus/karting/data:/data:rw
      - /mnt/data/kibergus/karting/media:/media:ro
      - /mnt/data/kibergus/karting/analysis/keys.json:/app/keys.json:ro
      - /mnt/data/kibergus/karting/analysis/docker_config.json:/app/config.json:ro
    networks:
      - ghost_ghost_network
    extra_hosts:
      - "host.docker.internal:172.19.0.1"

networks:
  ghost_ghost_network:
    external: true
